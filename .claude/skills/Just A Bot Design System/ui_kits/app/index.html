<!-- @dsCard group="App" viewport="390x780" name="App — Interactive" subtitle="JUST A BOT kid-friendly encyclopedia" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just A Bot</title>
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--color-neutral-300);
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Phone shell */
    .app-shell {
      width: 390px;
      height: 780px;
      background: var(--color-bg);
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-2xl), 0 0 0 8px var(--color-neutral-800);
      position: relative;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 0;
      flex-shrink: 0;
    }
    .status-time {
      font-size: 15px;
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .status-icon {
      width: 16px;
      height: 10px;
      background: var(--color-text-primary);
      border-radius: 2px;
      opacity: 0.8;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .header-logo-text {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
      letter-spacing: var(--tracking-snug);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-green-500);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 0;
    }
    .back-btn svg { flex-shrink: 0; }

    .app-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
    }
    .app-body::-webkit-scrollbar { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="HomeView.jsx"></script>
  <script type="text/babel" src="AnswerView.jsx"></script>

  <script type="text/babel">
    function App() {
      const ds = window.JustABotDesignSystem_d87885;
      if (!ds) return null;
      const { Button } = ds;

      // Persist last query across refreshes
      const [query, setQuery] = React.useState(
        () => sessionStorage.getItem('jab_query') || ''
      );
      const [view, setView] = React.useState(
        () => sessionStorage.getItem('jab_query') ? 'answer' : 'home'
      );

      const handleSearch = (q) => {
        sessionStorage.setItem('jab_query', q);
        setQuery(q);
        setView('answer');
      };

      const handleBack = () => {
        sessionStorage.removeItem('jab_query');
        setView('home');
        setQuery('');
      };

      // Format current time for status bar
      const [time, setTime] = React.useState(() => {
        const d = new Date();
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      });

      return (
        <div className="app-shell">

          {/* Status bar */}
          <div className="status-bar">
            <span className="status-time">{time}</span>
            <div className="status-icons">
              <div className="status-icon" style={{width:14,height:10,background:'var(--color-text-primary)',borderRadius:2,opacity:0.8}}></div>
              <div className="status-icon" style={{width:12,height:10,borderRadius:2}}></div>
              <div className="status-icon" style={{width:22,height:11,borderRadius:2,border:'1.5px solid var(--color-text-primary)',background:'transparent',position:'relative'}}>
                <div style={{position:'absolute',left:2,top:2,bottom:2,width:'65%',background:'var(--color-text-primary)',borderRadius:1}}></div>
                <div style={{position:'absolute',right:-4,top:3,width:3,height:5,background:'var(--color-neutral-400)',borderRadius:1}}></div>
              </div>
            </div>
          </div>

          {/* App header */}
          <div className="app-header">
            {view === 'answer' ? (
              <button className="back-btn" onClick={handleBack}>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M11 4L6 9L11 14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
                Back
              </button>
            ) : (
              <div className="header-logo">
                <img src="../../assets/logomark.svg" width="24" height="24" alt="bot" />
                <span className="header-logo-text">JUST A BOT</span>
              </div>
            )}
            {view === 'answer' && (
              <div className="header-logo">
                <img src="../../assets/logomark.svg" width="22" height="22" alt="bot" />
                <span className="header-logo-text" style={{fontSize:'var(--text-sm)'}}>JUST A BOT</span>
              </div>
            )}
          </div>

          {/* Main content */}
          <div className="app-body">
            {view === 'home'
              ? <HomeView onSearch={handleSearch} />
              : <AnswerView query={query} onBack={handleBack} onSearch={handleSearch} />
            }
          </div>

        </div>
      );
    }

    // Mount once the DS bundle is available (retry against load races)
    (function mount() {
      if (!window.JustABotDesignSystem_d87885) return setTimeout(mount, 50);
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    })();
  </script>
</body>
</html>
