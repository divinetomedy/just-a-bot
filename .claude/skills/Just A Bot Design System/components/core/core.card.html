<!-- @dsCard group="Components" viewport="700x560" name="Core Components" subtitle="Button, Badge, Chip, Card, Input, Switch, LoadingDots" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--color-bg); padding: 24px; }
    .section { margin-bottom: 24px; }
    .section-label { font-size: var(--text-xs); font-weight: var(--font-weight-semibold); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--tracking-widest); margin-bottom: 10px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Chip, Card, Input, Switch, LoadingDots } = window.JustABotDesignSystem_d87885;

function App() {
  const [sw1, setSw1] = React.useState(true);
  const [sw2, setSw2] = React.useState(false);
  const [chip, setChip] = React.useState('Animals');

  return (
    <div>
      {/* Buttons */}
      <div className="section">
        <div className="section-label">Button</div>
        <div className="row">
          <Button variant="primary">Primary</Button>
          <Button variant="secondary">Secondary</Button>
          <Button variant="outline">Outline</Button>
          <Button variant="ghost">Ghost</Button>
          <Button variant="danger">Danger</Button>
        </div>
        <div className="row" style={{marginTop: 8}}>
          <Button variant="primary" size="sm">Small</Button>
          <Button variant="primary" size="md">Medium</Button>
          <Button variant="primary" size="lg">Large</Button>
          <Button variant="primary" loading>Loading</Button>
          <Button variant="primary" disabled>Disabled</Button>
        </div>
      </div>

      {/* Badges */}
      <div className="section">
        <div className="section-label">Badge</div>
        <div className="row">
          {['blue','green','orange','yellow','purple','pink','neutral','danger'].map(c =>
            <Badge key={c} color={c}>{c.charAt(0).toUpperCase()+c.slice(1)}</Badge>
          )}
          <Badge color="green" dot>Active</Badge>
        </div>
      </div>

      {/* Chips */}
      <div className="section">
        <div className="section-label">Chip</div>
        <div className="row">
          {['Animals','Space','History','Science','Math','Art'].map(t =>
            <Chip key={t} selected={chip===t} onClick={()=>setChip(t)}>{t}</Chip>
          )}
        </div>
      </div>

      {/* Input */}
      <div className="section">
        <div className="section-label">Input</div>
        <div style={{display:'flex', flexDirection:'column', gap:8, maxWidth:400}}>
          <Input placeholder="Ask me anything…" size="lg" />
          <Input label="Topic" placeholder="E.g. black holes" hint="Try any science topic" />
          <Input placeholder="Error state" error="Please enter a valid question" />
        </div>
      </div>

      {/* Switch + LoadingDots */}
      <div className="section">
        <div className="section-label">Switch · LoadingDots</div>
        <div className="row">
          <Switch checked={sw1} onChange={setSw1} label="Simple language" />
          <Switch checked={sw2} onChange={setSw2} label="Show sources" />
          <Switch checked={true} disabled label="Disabled" />
          <span style={{display:'inline-flex',alignItems:'center',gap:8,marginLeft:8}}>
            <LoadingDots size="sm" />
            <LoadingDots size="md" />
            <LoadingDots size="lg" color="purple" />
          </span>
        </div>
      </div>

      {/* Card */}
      <div className="section">
        <div className="section-label">Card</div>
        <div className="row" style={{alignItems:'flex-start'}}>
          <Card padding="md" style={{width:180}}>
            <Badge color="blue" size="sm" style={{marginBottom:8}}>Science</Badge>
            <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:'var(--text-sm)'}}>What is gravity?</div>
          </Card>
          <Card padding="md" interactive accent="green" style={{width:180}}>
            <Badge color="green" size="sm" style={{marginBottom:8}}>Biology</Badge>
            <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:'var(--text-sm)'}}>How do cells divide?</div>
          </Card>
          <Card padding="md" accent="purple" style={{width:180}}>
            <Badge color="purple" size="sm" style={{marginBottom:8}}>Space</Badge>
            <div style={{fontFamily:'var(--font-sans)',fontWeight:600,fontSize:'var(--text-sm)'}}>How big is the universe?</div>
          </Card>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
