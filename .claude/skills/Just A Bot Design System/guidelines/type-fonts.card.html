<!-- @dsCard group="Type" viewport="700x130" name="Font Families" subtitle="Space Grotesk (sans) · Space Mono (mono)" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--color-bg); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; align-items: baseline; gap: 16px; }
    .meta { width: 100px; font-size: 10px; font-family: var(--font-mono); color: var(--color-text-muted); flex-shrink: 0; }
    .sample { font-size: var(--text-2xl); font-weight: var(--font-weight-bold); color: var(--color-text-primary); }
    .weights { display: flex; gap: 20px; }
    .w { font-family: var(--font-sans); font-size: var(--text-base); color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <div class="row">
    <div class="meta">Space Grotesk</div>
    <div class="sample" style="font-family:var(--font-sans)">JUST A BOT — AaBbCc 0123</div>
  </div>
  <div class="row">
    <div class="meta">Space Mono</div>
    <div class="sample" style="font-family:var(--font-mono);font-size:var(--text-xl)">just_a_bot() → { "answer": true }</div>
  </div>
  <div class="weights">
    <div class="w" style="font-weight:300">Light 300</div>
    <div class="w" style="font-weight:400">Regular 400</div>
    <div class="w" style="font-weight:500">Medium 500</div>
    <div class="w" style="font-weight:600">Semibold 600</div>
    <div class="w" style="font-weight:700">Bold 700</div>
  </div>
</body>
</html>
