<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--color-bg); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .row { display: flex; align-items: center; gap: 16px; }
    .label { width: 120px; font-size: var(--text-xs); font-family: var(--font-mono); color: var(--color-text-muted); flex-shrink: 0; }
    .demo { display: flex; align-items: center; gap: 10px; flex: 1; }
    .bar { height: 8px; border-radius: var(--radius-full); background: var(--color-green-400); }
    .pill { display: inline-flex; align-items: center; padding: 6px 14px; background: var(--color-green-400); color: white; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; cursor: pointer; transition: all 150ms var(--ease-default); }
    .pill:hover { background: var(--color-green-500); }
    .pill:active { transform: scale(0.96); }
    .bounce-pill { background: var(--color-purple-500); transition: all 200ms var(--ease-bounce); }
    .bounce-pill:hover { transform: scale(1.06); }
    .val { font-size: 10px; font-family: var(--font-mono); color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div class="row">
    <div class="label">fast · 150ms</div>
    <div class="demo"><div class="bar" style="width:150px"></div><div class="val">hover, focus, border changes</div></div>
  </div>
  <div class="row">
    <div class="label">normal · 200ms</div>
    <div class="demo"><div class="bar" style="width:200px"></div><div class="val">button press, panel open</div></div>
  </div>
  <div class="row">
    <div class="label">ease-default</div>
    <div class="demo"><span class="pill">Hover me</span><div class="val">cubic-bezier(0.16, 1, 0.3, 1) — spring</div></div>
  </div>
  <div class="row">
    <div class="label">ease-bounce</div>
    <div class="demo"><span class="pill bounce-pill">Hover me</span><div class="val">cubic-bezier(0.34, 1.56, 0.64, 1) — overshoot</div></div>
  </div>
</body>
</html>
