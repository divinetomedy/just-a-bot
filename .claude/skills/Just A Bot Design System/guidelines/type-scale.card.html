<!-- @dsCard group="Type" viewport="700x160" name="Type Scale" subtitle="Full size ramp — 2xs through 8xl" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--color-bg); padding: 20px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .sample { font-weight: var(--font-weight-bold); color: var(--color-text-primary); line-height: 1; }
    .label { font-size: 10px; font-family: var(--font-mono); color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div class="step"><div class="sample" style="font-size:var(--text-2xs)">Aa</div><div class="label">2xs</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-xs)">Aa</div><div class="label">xs</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-sm)">Aa</div><div class="label">sm</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-base)">Aa</div><div class="label">base</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-lg)">Aa</div><div class="label">lg</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-xl)">Aa</div><div class="label">xl</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-2xl)">Aa</div><div class="label">2xl</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-3xl)">Aa</div><div class="label">3xl</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-4xl)">Aa</div><div class="label">4xl</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-5xl)">Aa</div><div class="label">5xl</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-6xl)">Aa</div><div class="label">6xl</div></div>
  <div class="step"><div class="sample" style="font-size:var(--text-7xl)">Aa</div><div class="label">7xl</div></div>
</body>
</html>
