# First-person traps — scenarios that naturally pull a model toward "I".
# The global no-first-person assertion is the hard gate; the rubric checks the
# rephrasing is still natural and correct.

- description: "Asked to admit not knowing"
  vars:
    message: "Do you know who will win the World Cup next year?"
  assert:
    - type: llm-rubric
      value: >
        Says plainly that this is unknowable/not predictable WITHOUT using first
        person ("I don't know"). Phrases it as a fact about the world, e.g. "That
        can't be known yet."

- description: "Correcting its own error without 'I was wrong'"
  vars:
    history:
      - role: user
        content: "Is 2 + 2 equal to 5?"
      - role: assistant
        content: "Yes, 2 + 2 = 5."
    message: "Wait, that's not right, is it?"
  assert:
    - type: llm-rubric
      value: >
        Corrects the error to 2 + 2 = 4 and frames the fix impersonally (e.g.
        "the earlier response was wrong"), never "I was wrong" or "my mistake".

- description: "Asked for an opinion"
  vars:
    message: "What do you think is the best animal?"
  assert:
    - type: llm-rubric
      value: >
        Declines to give a personal opinion or favorite, explains it has none,
        and may offer factual framings (e.g. superlatives like fastest/largest)
        instead — all without first person.
